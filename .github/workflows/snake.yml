name: 🐍 Generate Snake Animation

on:
  schedule:
    # Ejecutar todos los días a las 23:45 UTC (20:45 Chile)
    - cron: "45 23 * * *"
  workflow_dispatch: # Permite ejecutarlo manualmente desde Actions
  push:
    branches:
      - main

jobs:
  build:
    name: Generar Snake 🐍
    runs-on: ubuntu-latest

    steps:
      # 🧩 Checkout del repositorio
      - name: 🛠️ Clonar repositorio
        uses: actions/checkout@v4

      # 🧰 Usar el generador de snake de Platane
      - name: 🐍 Generar animación de commits
        uses: Platane/snk@v3
        with:
          github_user_name: AtsukaDeus
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 📦 Subir los artefactos generados como GitHub Pages
      - name: 🚀 Subir artefactos
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
